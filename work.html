<script>
    const projectItems = document.querySelectorAll(".project-item");

    const previewImage =
        document.getElementById("work-preview-image");

    const previewVideo =
        document.getElementById("work-preview-video");

    const placeholder =
        document.getElementById("work-placeholder");


    projectItems.forEach((item) => {

        const projectTitle =
            item.querySelector(".project-name");

        projectTitle.addEventListener("mouseenter", () => {

            const src = item.dataset.src;
            const type = item.dataset.type;

            placeholder.style.display = "none";


            if (type === "image") {

                previewVideo.pause();
                previewVideo.style.display = "none";

                previewImage.src = src;
                previewImage.style.display = "block";

            }


           if (type === "video") {
    previewImage.style.display = "none";

    previewVideo.pause();
    previewVideo.src = src;
    previewVideo.style.display = "block";

    previewVideo.load();

    previewVideo.play().catch((error) => {
        console.log("Video could not autoplay:", error);
    });
}

        });

    });
    
</script>

<script>
    /* ================================= */
    /* GALLERY ELEMENTS                  */
    /* ================================= */

    const galleryOverlay =
        document.getElementById("gallery-overlay");

    const galleryGrid =
        document.getElementById("gallery-grid");

    const galleryTitle =
        document.getElementById("gallery-title");

    const galleryClose =
        document.getElementById("gallery-close");

    const photoViewer =
        document.getElementById("photo-viewer");

    const photoViewerImage =
        document.getElementById("photo-viewer-image");


    /* ================================= */
    /* GALLERY PHOTOS                    */
    /* ================================= */

    const galleries = {

        "Witch Hat Atelier": [
            "./images/w1.png",
            "./images/w2.png",
            "./images/w3.png",
            "./images/w4.png",
            "./images/w5.png",
            "./images/w6.png",
            "./images/w7.png",
            "./images/w8.png",
            "./images/w9.png",
            "./images/w10.png",
            "./images/w11.png",
            "./images/w12.png",
            "./images/w13.png"
        ],


        "Umamusume: Pretty Derby": [
            "./images/u1.png",
            "./images/u2.png",
            "./images/u3.png",
            "./images/u4.png",
            "./images/u5.png",
            "./images/u6.png",
            "./images/u7.png",
            "./images/u8.png"
        ]

    };


    /* ================================= */
    /* BUILD GALLERY                     */
    /* ================================= */

    function loadGallery(galleryName) {

        /* Remove old gallery photos */
        galleryGrid.innerHTML = "";


        const photos = galleries[galleryName];


        if (!photos) {
            return;
        }


        photos.forEach((photoSrc) => {

            const image =
                document.createElement("img");


            image.src = photoSrc;

            image.className =
                "gallery-thumb";

            image.alt =
                galleryName + " photography";


            /* CLICK PHOTO -> ENLARGE */
            image.addEventListener(
                "click",
                (event) => {

                    event.stopPropagation();

                    photoViewerImage.src =
                        photoSrc;

                    photoViewer.classList.add(
                        "photo-open"
                    );

                }
            );


            galleryGrid.appendChild(image);

        });


        /* Always start gallery from top */
        galleryGrid.scrollTop = 0;
    }


    /* ================================= */
    /* COSPLAY PROJECT BUTTONS           */
    /* ================================= */

    const galleryProjects =
        document.querySelectorAll(
            '.project-item[data-action="gallery"]'
        );


    galleryProjects.forEach((project) => {

        const projectName =
            project.querySelector(
                ".project-name"
            );


        /* ----------------------------- */
        /* CHANGE TEXT ON HOVER          */
        /* ----------------------------- */

        project.addEventListener(
            "mouseenter",
            () => {

                if (projectName.dataset.hover) {

                    projectName.textContent =
                        projectName.dataset.hover;

                }

            }
        );


        project.addEventListener(
            "mouseleave",
            () => {

                if (projectName.dataset.original) {

                    projectName.textContent =
                        projectName.dataset.original;

                }

            }
        );


        /* ----------------------------- */
        /* OPEN GALLERY ON CLICK         */
        /* ----------------------------- */

        project.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                const galleryName =
                    project.dataset.gallery;


                galleryTitle.textContent =
                    galleryName + " Gallery";


                loadGallery(galleryName);


                galleryOverlay.classList.add(
                    "gallery-open"
                );

            }
        );

    });


    /* ================================= */
    /* CLOSE GALLERY WITH X              */
    /* ================================= */

    galleryClose.addEventListener(
        "click",
        (event) => {

            event.stopPropagation();

            galleryOverlay.classList.remove(
                "gallery-open"
            );

        }
    );


    /* ================================= */
    /* CLICK OUTSIDE WINDOW TO CLOSE     */
    /* ================================= */

    galleryOverlay.addEventListener(
        "click",
        (event) => {

            if (event.target === galleryOverlay) {

                galleryOverlay.classList.remove(
                    "gallery-open"
                );

            }

        }
    );


    /* ================================= */
    /* CLICK LARGE PHOTO -> CLOSE PHOTO  */
    /* ================================= */

    photoViewer.addEventListener(
        "click",
        () => {

            photoViewer.classList.remove(
                "photo-open"
            );

        }
    );

</script>
